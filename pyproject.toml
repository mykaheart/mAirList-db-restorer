[project]
name = "mairlists-db-restorer"
version = "0.4.5"
description = "Script to clean and update a mAirList database (fetch metadata from MusicBrainz & Discogs)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Myka Vormeng"}]
license = {text = "MIT"}
dependencies = [
  "pandas>=1.5",
  "requests>=2.28",
  "rich>=13.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
