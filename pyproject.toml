[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mAirList-db-restorer"
version = "0.51.01"
description = "Intelligentes Metadaten-Reparatur-Tool für lokale mAirList Datenbanken"
readme = "README.md"
license = {text = "Other"}
authors = [
    {name = "Myka Vormeng", email = ""}
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "requests>=2.25.0",
    "rich>=10.0.0",
]
keywords = ["mairlist", "database", "metadata", "restoration", "musicbrainz", "discogs"]

[project.urls]
Homepage = "https://github.com/mykaheart/mAirList-db-restorer"
Repository = "https://github.com/mykaheart/mAirList-db-restorer.git"
Issues = "https://github.com/mykaheart/mAirList-db-restorer/issues"

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0",
]
