name: Import 0.66 final payload

on:
  push:
    branches:
      - release/0.66.00-beta

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.66.00-beta
          fetch-depth: 0
      - name: Download verified 0.66 source
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=13He1jv0x7eGkv87WmR0P318TRXOiPfXL' \
            -o /tmp/release.zip
          echo '6a960deea0866baae735406ce028bfc8661c9c86eed75ee1a6e97f360d6b72cb  /tmp/release.zip' | sha256sum -c -
      - name: Import release files
        run: |
          rm -rf /tmp/release066
          mkdir -p /tmp/release066
          unzip -q /tmp/release.zip -d /tmp/release066
          for f in CHANGELOG.md CHANGELOG_DE.md CHANGELOG_NL.md Manual_DE.md Manual_EN.md Manual_NL.md README.md README_EN.md README_NL.md api.py db.py main.py pyproject.toml utils.py version.txt; do
            cp "/tmp/release066/$f" "$f"
          done
          mkdir -p tests
          cp /tmp/release066/tests/README.md tests/README.md
          cp /tmp/release066/tests/test_restorer.py tests/test_restorer.py
          rm -f .github/workflows/release-066-import.yml
      - name: Verify tests
        run: |
          python -m compileall -q .
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit imported release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.66.00 BETA' || exit 0
          git push origin HEAD:release/0.66.00-beta
