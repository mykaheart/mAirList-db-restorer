name: Import 0.66.01 final payload

on:
  push:
    branches:
      - release/0.66.01-beta

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.66.01-beta
          fetch-depth: 0
      - name: Download verified 0.66.01 source
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1DENOI_kHJ9nkZPAJlJfWq9hpswaGx2sy' \
            -o /tmp/release.zip
          echo '76db3acf82147cb1efe62c21d6e3a834018170e03f2ddceb3658f8e9ba7ff47c  /tmp/release.zip' | sha256sum -c -
      - name: Import release files
        run: |
          rm -rf /tmp/release06601
          mkdir -p /tmp/release06601
          unzip -q /tmp/release.zip -d /tmp/release06601
          for f in CHANGELOG.md CHANGELOG_DE.md CHANGELOG_NL.md Manual_DE.md Manual_EN.md Manual_NL.md README.md README_EN.md README_NL.md api.py db.py main.py pyproject.toml utils.py version.txt; do
            cp "/tmp/release06601/$f" "$f"
          done
          mkdir -p tests
          cp /tmp/release06601/tests/README.md tests/README.md
          cp /tmp/release06601/tests/test_restorer.py tests/test_restorer.py
          rm -f .github/workflows/release-06601-import.yml
      - name: Verify tests
        run: |
          python -m compileall -q .
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit imported release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.66.01 BETA' || exit 0
          git push origin HEAD:release/0.66.01-beta
